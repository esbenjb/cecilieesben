<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Invitation · Cecilie &amp; Esben</title>
    <meta name="description" content="" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="assets/img/monogram.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Jost:ital,wght@0,300;0,400;0,500;1,300&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/print-a5.css" media="print" />
  </head>

  <body data-title-key="meta.title.invitation" data-description-key="meta.description.invitation">
    <a class="skip-link" href="#main" data-i18n="nav.home">Forsiden</a>

    <header class="header is-scrolled" data-header data-header-solid>
      <div class="header__inner">
        <nav class="header__nav" aria-label="Hovedmenu" data-i18n-attr="aria-label:nav.label">
          <button
            class="nav-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="nav-menu"
            aria-label="Åbn menu"
            data-i18n-attr="aria-label:nav.toggle"
            data-nav-toggle
          >
            <span></span>
          </button>
          <ul class="nav__list" id="nav-menu" data-nav-menu>
            <li><a href="index.html#rejsen" data-i18n="nav.us">Vejen hertil</a></li>
            <li><a href="index.html#program" data-i18n="nav.program">Program</a></li>
            <li><a href="index.html#stedet" data-i18n="nav.venue">Stedet</a></li>
            <li><a href="index.html#omkring" data-i18n="nav.around">Søhøjlandet</a></li>
            <li><a href="index.html#praktisk" data-i18n="nav.practical">Praktisk</a></li>
            <li><a href="index.html#gaver" data-i18n="nav.gifts">Gaver</a></li>
          </ul>
        </nav>

        <a class="monogram" href="index.html" aria-label="Cecilie &amp; Esben">
          <span class="mark mark--boat" aria-hidden="true"></span>
        </a>

        <div class="header__actions">
          <a class="btn header__rsvp" href="index.html#svar" data-i18n="nav.rsvp">Svar</a>
          <div class="lang" role="group" aria-label="Skift sprog" data-i18n-attr="aria-label:lang.label">
            <button class="lang__btn" type="button" data-lang-btn="da" aria-pressed="true"
                    title="Dansk" data-i18n-attr="title:lang.da">DA</button>
            <button class="lang__btn" type="button" data-lang-btn="en" aria-pressed="false"
                    title="Engelsk" data-i18n-attr="title:lang.en">EN</button>
          </div>
        </div>
      </div>
    </header>

    <main id="main" class="inv-page">
      <div class="inv-intro">
        <div class="wrap wrap--narrow">
          <span class="eyebrow" data-i18n="inv.eyebrow">Invitationen</span>
          <p class="inv-intro__text" data-i18n="inv.intro"></p>
          <p class="inv-intro__actions">
            <button class="btn" type="button" data-print data-i18n="inv.print">
              Print invitationen
            </button>
            <a class="btn btn--ghost" href="index.html" data-i18n="inv.home">Tilbage til forsiden</a>
          </p>
        </div>
      </div>

      <!--
        One A5 sheet, 148 x 210 mm, printed on both sides. No folds: the two
        .sheet--a5 blocks are the two sides of the same piece of paper, and each
        breaks to its own page, so the print job is exactly two pages.

        The layout is the 2a artboard from `Bryllupsflyer A5.dc.html`, drawn in
        the site's own Fraunces and a faded hunter green rather than the sage of
        the source file. The canvas there is 559 x 794 px, which is A5 at 96dpi,
        so --u is one of those px and every number below is the design's own.
      -->
      <div class="sheets">
        <!-- ------------------------------------------------------- front -->
        <figure class="sheet-wrap">
          <figcaption class="sheet-label" data-i18n="inv.side.a">Forside</figcaption>

          <div class="sheet sheet--a5">
            <section class="panel inv-front">
              <img class="inv-front__wash" src="assets/img/lakes-wash.jpg" alt=""
                   width="1406" height="644" />
              <div class="inv-front__veil" aria-hidden="true"></div>

              <div class="inv-front__body">
                <div class="inv-front__top">
                  <p class="inv-front__eyebrow" data-i18n="inv.front.eyebrow"></p>
                  <p class="inv-front__range" data-i18n="inv.front.range">11.–13. juni 2027</p>
                </div>

                <div class="inv-front__mid">
                  <h1 class="inv-front__names">Cecilie <span class="inv-amp">&amp;</span> Esben</h1>
                  <span class="inv-front__rule" aria-hidden="true"></span>
                </div>

                <div class="inv-front__foot">
                  <p class="inv-front__invite" data-i18n="inv.main.invite"></p>
                  <p class="inv-front__date" data-i18n="inv.main.date"></p>
                  <p class="inv-front__venue" data-i18n="inv.main.venue"></p>
                  <p class="inv-front__address" data-i18n="inv.main.address"></p>
                </div>
              </div>
            </section>
          </div>
        </figure>

        <!-- -------------------------------------------------------- back -->
        <figure class="sheet-wrap">
          <figcaption class="sheet-label" data-i18n="inv.side.b">Bagside</figcaption>

          <div class="sheet sheet--a5">
            <section class="panel inv-reverse">
              <header class="inv-reverse__head">
                <div>
                  <h2 class="inv-reverse__title" data-i18n="inv.back.title">Weekenden</h2>
                  <p class="inv-reverse__sub" data-i18n="inv.back.sub"></p>
                </div>
                <p class="inv-reverse__names">Cecilie <span class="inv-amp">&amp;</span> Esben</p>
              </header>

              <div class="inv-days" data-schedule="card"></div>

              <div class="inv-practical">
                <div class="inv-fact">
                  <h3 data-i18n="inv.practical.1.label"></h3>
                  <p data-i18n="inv.practical.1.value"></p>
                </div>
                <div class="inv-fact">
                  <h3 data-i18n="inv.practical.2.label"></h3>
                  <p data-i18n="inv.practical.2.value"></p>
                </div>
                <div class="inv-fact">
                  <h3 data-i18n="inv.practical.3.label"></h3>
                  <p data-i18n="inv.practical.3.value"></p>
                </div>
                <div class="inv-fact">
                  <h3 data-i18n="inv.practical.4.label"></h3>
                  <p data-i18n="inv.practical.4.value"></p>
                </div>
              </div>

              <img class="inv-reverse__boat" src="assets/img/hjejlen-brudepar.png" alt=""
                   width="780" height="368" />

              <div class="inv-reverse__foot">
                <img class="inv-qr" src="assets/img/qr-cecilieesben.png"
                     alt="" data-i18n-attr="alt:inv.qr.alt" width="300" height="300" />
                <div>
                  <p class="inv-web__label" data-i18n="inv.practical.web.label"></p>
                  <p class="inv-web" data-i18n="inv.web">cecilieesben.com</p>
                </div>
              </div>
            </section>
          </div>
        </figure>
      </div>

      <p class="sheet-note" data-i18n="inv.print.note"></p>
    </main>

    <footer class="footer inv-page__footer">
      <span class="mark mark--boat footer__mark" aria-hidden="true"></span>
      <p class="footer__title" data-i18n="footer.title">Vi glæder os til at se jer</p>
      <p class="footer__names" data-i18n="footer.names">Cecilie &amp; Esben</p>
      <p class="footer__date" data-i18n="footer.date"></p>
    </footer>

    <script src="assets/js/translations.js"></script>
    <script src="assets/js/i18n.js"></script>
    <!-- ?v= is a cache buster. Bump it whenever main.js changes in a way a
         returning visitor must not miss, so nobody keeps running the old file. -->
    <script src="assets/js/main.js?v=2"></script>
  </body>
</html>
