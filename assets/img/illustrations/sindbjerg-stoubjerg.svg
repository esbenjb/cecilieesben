<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" width="1600" height="620"
     role="img" aria-label="Akvarel af lyngbakkerne Sindbjerg og Stoubjerg ved Sejs-Svejbæk">
  <!--
    Sindbjerg and Stoubjerg — the heather hills above Sejs-Svejbæk, east of
    Silkeborg. Blooming heather in late summer, grass hollows, scattered oaks
    and junipers, pine forest behind. Watercolour house style, washed back.
  -->
  <defs>
    <linearGradient id="sb-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCE6E6"/>
      <stop offset="55%" stop-color="#EAEFE9"/>
      <stop offset="100%" stop-color="#F3EFE6"/>
    </linearGradient>
    <linearGradient id="sb-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A9B7B4"/>
      <stop offset="100%" stop-color="#93A497"/>
    </linearGradient>
    <linearGradient id="sb-hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B9A6B4"/>
      <stop offset="60%" stop-color="#A88BA0"/>
      <stop offset="100%" stop-color="#8E7387"/>
    </linearGradient>
    <linearGradient id="sb-fore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A88BA0"/>
      <stop offset="100%" stop-color="#7C6376"/>
    </linearGradient>

    <filter id="sb-wash" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="14" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1"/>
    </filter>
    <filter id="sb-bleed" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="sb-cloud" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="sb-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <!-- Heather speckle: dry-brush dots over the hill washes -->
    <pattern id="sb-heather" width="26" height="22" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="5" r="2.4" fill="#7C6376" opacity="0.3"/>
      <circle cx="17" cy="12" r="2" fill="#6B5566" opacity="0.26"/>
      <circle cx="9" cy="17" r="1.7" fill="#8E7387" opacity="0.3"/>
      <circle cx="22" cy="3" r="1.5" fill="#6B5566" opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="1600" height="620" fill="url(#sb-sky)"/>

  <!-- Big summer cumulus -->
  <g filter="url(#sb-cloud)" opacity="0.75">
    <ellipse cx="300" cy="96" rx="210" ry="62" fill="#FFFFFF"/>
    <ellipse cx="450" cy="70" rx="150" ry="48" fill="#FFFFFF"/>
    <ellipse cx="1020" cy="76" rx="240" ry="58" fill="#FFFFFF"/>
    <ellipse cx="1240" cy="110" rx="180" ry="46" fill="#FFFFFF"/>
    <ellipse cx="760" cy="132" rx="170" ry="34" fill="#FFFFFF"/>
  </g>
  <g filter="url(#sb-cloud)" opacity="0.3">
    <ellipse cx="360" cy="140" rx="180" ry="30" fill="#A9B7B4"/>
    <ellipse cx="1100" cy="146" rx="200" ry="26" fill="#A9B7B4"/>
  </g>

  <!-- Distant forest horizon, hazy -->
  <g filter="url(#sb-bleed)" opacity="0.55">
    <path d="M0 288 C 200 276, 380 292, 560 282 C 760 271, 940 290, 1160 280
             C 1340 271, 1470 288, 1600 280 L1600 330 L0 330 Z" fill="url(#sb-far)"/>
  </g>

  <!-- Pine forest along the ridge -->
  <g filter="url(#sb-bleed)">
    <path d="M0 322 C 150 306, 300 320, 470 310 C 640 300, 820 318, 1000 308
             C 1180 298, 1400 316, 1600 306 L1600 372 L0 372 Z" fill="#6E8168"/>
  </g>
  <g fill="#566B54" filter="url(#sb-bleed)" opacity="0.92">
    <path d="M60 318 l14-40 14 40z M108 320 l10-30 10 30z"/>
    <path d="M470 310 l16-46 16 46z M520 314 l11-32 11 32z"/>
    <path d="M900 308 l15-42 15 42z M950 312 l10-28 10 28z"/>
    <path d="M1290 310 l16-44 16 44z M1344 314 l11-30 11 30z"/>
    <path d="M1500 306 l14-38 14 38z"/>
  </g>

  <!-- Stoubjerg: the far heather dome -->
  <g filter="url(#sb-wash)">
    <path d="M0 400 C 130 352, 250 330, 400 342 C 540 353, 640 386, 760 396
             C 880 406, 980 392, 1080 380 L1080 470 L0 470 Z" fill="url(#sb-hill)"/>
  </g>
  <rect x="0" y="330" width="1080" height="140" fill="url(#sb-heather)" opacity="0.5"
        style="mix-blend-mode:multiply"/>

  <!-- Grass hollows: the green streaks running down the slopes -->
  <g filter="url(#sb-bleed)" fill="#9DAE86" opacity="0.65">
    <path d="M300 350 c30 26 40 60 34 96 -22-30 -40-56 -34-96z"/>
    <path d="M620 380 c26 22 34 52 30 82 -20-26 -34-48 -30-82z"/>
    <path d="M900 384 c22 20 30 44 26 70 -18-22 -30-42 -26-70z"/>
  </g>

  <!-- Sindbjerg: the nearer, larger hill -->
  <g filter="url(#sb-wash)">
    <path d="M760 430 C 900 386, 1060 366, 1220 380 C 1360 392, 1480 424, 1600 414
             L1600 540 L760 540 Z" fill="url(#sb-hill)"/>
  </g>
  <rect x="740" y="366" width="860" height="180" fill="url(#sb-heather)" opacity="0.55"
        style="mix-blend-mode:multiply"/>
  <g filter="url(#sb-bleed)" fill="#9DAE86" opacity="0.6">
    <path d="M1130 388 c30 26 40 60 34 98 -22-32 -40-58 -34-98z"/>
    <path d="M1400 410 c24 22 32 50 28 78 -18-24 -32-46 -28-78z"/>
  </g>

  <!-- Scattered oaks and junipers -->
  <g filter="url(#sb-bleed)">
    <g fill="#7C8F6C">
      <ellipse cx="196" cy="404" rx="42" ry="30"/>
      <ellipse cx="470" cy="392" rx="34" ry="25"/>
      <ellipse cx="712" cy="428" rx="30" ry="22"/>
      <ellipse cx="1046" cy="404" rx="46" ry="32"/>
      <ellipse cx="1330" cy="418" rx="36" ry="26"/>
    </g>
    <g fill="#5E7157" opacity="0.75">
      <ellipse cx="184" cy="412" rx="26" ry="18"/>
      <ellipse cx="1036" cy="412" rx="28" ry="19"/>
      <ellipse cx="1322" cy="424" rx="22" ry="15"/>
    </g>
    <g fill="#566B54">
      <path d="M356 452 c8-26 12-40 12-52 2 12 6 26 12 52z"/>
      <path d="M860 470 c7-22 10-34 10-44 2 10 5 22 10 44z"/>
      <path d="M1214 448 c7-24 10-36 10-48 2 12 5 24 10 48z"/>
    </g>
  </g>

  <!-- Sandy path winding over the ridge -->
  <g filter="url(#sb-wash)" opacity="0.85">
    <path d="M406 342 c-6 40 6 74 26 104 24 36 62 58 112 70 58 14 118 8 176-6
             56-14 108-30 176-30" fill="none" stroke="#E0D3B9" stroke-width="10"
          stroke-linecap="round"/>
    <path d="M1128 382 c14 30 12 58 -2 84" fill="none" stroke="#E0D3B9" stroke-width="7"
          stroke-linecap="round"/>
  </g>

  <!-- Foreground bank of blooming heather -->
  <g filter="url(#sb-wash)">
    <path d="M0 500 C 200 462, 420 476, 640 508 C 860 540, 1080 528, 1300 500
             C 1420 484, 1520 486, 1600 494 L1600 620 L0 620 Z" fill="url(#sb-fore)"/>
  </g>
  <rect x="0" y="460" width="1600" height="160" fill="url(#sb-heather)" opacity="0.75"
        style="mix-blend-mode:multiply"/>

  <!-- Individual heather sprigs catching the light -->
  <g stroke="#C0A8B6" stroke-width="3" stroke-linecap="round" opacity="0.6"
     filter="url(#sb-bleed)">
    <path d="M120 596 c4-26 2-44 -4-62"/>
    <path d="M260 606 c6-28 4-46 -2-64"/>
    <path d="M430 592 c4-24 2-40 -4-56"/>
    <path d="M640 614 c6-30 4-48 -2-66"/>
    <path d="M880 604 c4-26 2-42 -4-60"/>
    <path d="M1120 592 c6-28 4-44 -2-62"/>
    <path d="M1380 586 c4-24 2-40 -4-58"/>
  </g>

  <rect width="1600" height="620" filter="url(#sb-grain)" opacity="0.1"
        style="mix-blend-mode:multiply"/>
</svg>
