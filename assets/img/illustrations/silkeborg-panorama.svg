<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560"
     role="img" aria-label="Akvarel af Silkeborgsøerne med skov, sø og hjuldamperen Hjejlen">
  <!--
    PLACEHOLDER ASSET.
    A hand-painted watercolour panorama should replace this file — see DESIGN.md
    for the illustration brief. Same filename, same 1600x560 proportions, and the
    hero needs no changes. Painted here in SVG so the site looks finished today.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3EFE6"/>
      <stop offset="45%" stop-color="#EAEFE9"/>
      <stop offset="100%" stop-color="#DCE6E6"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9DB4B8"/>
      <stop offset="40%" stop-color="#7E9AA1"/>
      <stop offset="100%" stop-color="#66808A"/>
    </linearGradient>
    <linearGradient id="bank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A3B08D"/>
      <stop offset="100%" stop-color="#93A487"/>
    </linearGradient>

    <!-- Wet edges: nudge every painted shape with low-frequency noise. -->
    <filter id="wet" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <filter id="wetSoft" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="haze" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <!-- Paper grain laid over the whole painting. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="560" fill="url(#sky)"/>

  <!-- Faint clouds -->
  <g filter="url(#haze)" opacity="0.55">
    <ellipse cx="300" cy="120" rx="240" ry="46" fill="#FFFFFF"/>
    <ellipse cx="1180" cy="90" rx="300" ry="40" fill="#FFFFFF"/>
    <ellipse cx="820" cy="160" rx="180" ry="30" fill="#FFFFFF"/>
  </g>

  <!-- Far hills -->
  <g filter="url(#wetSoft)" opacity="0.5">
    <path d="M0 300 C 180 268, 330 288, 470 274 C 640 258, 780 286, 950 270
             C 1120 254, 1300 284, 1600 266 L1600 340 L0 340 Z" fill="#A9B7B4"/>
  </g>
  <g filter="url(#wetSoft)" opacity="0.72">
    <path d="M0 322 C 200 300, 360 320, 540 306 C 720 292, 900 318, 1080 304
             C 1260 290, 1440 314, 1600 300 L1600 372 L0 372 Z" fill="#93A497"/>
  </g>

  <!-- Near forest band -->
  <g filter="url(#wet)">
    <path d="M0 352 C 120 334, 210 352, 300 340 C 400 326, 470 348, 560 338
             C 660 326, 730 350, 830 342 C 940 332, 1010 352, 1110 344
             C 1230 334, 1330 354, 1440 344 C 1520 337, 1560 348, 1600 342
             L1600 392 L0 392 Z" fill="#6E8168"/>
  </g>

  <!-- Individual treetops along the shoreline -->
  <g fill="#566B54" filter="url(#wetSoft)" opacity="0.95">
    <path d="M96 356 l16-40 16 40z"/>
    <path d="M150 358 l12-32 12 32z"/>
    <path d="M262 352 l18-46 18 46z"/>
    <path d="M470 356 l14-36 14 36z"/>
    <path d="M700 350 l20-50 20 50z"/>
    <path d="M760 356 l12-30 12 30z"/>
    <path d="M1010 352 l17-42 17 42z"/>
    <path d="M1240 354 l15-38 15 38z"/>
    <path d="M1300 357 l11-28 11 28z"/>
    <path d="M1470 352 l18-44 18 44z"/>
  </g>

  <!-- Reed edge -->
  <g filter="url(#wetSoft)" opacity="0.9">
    <path d="M0 390 C 200 380, 380 396, 600 388 C 820 380, 1000 396, 1220 388
             C 1400 382, 1500 394, 1600 388 L1600 404 L0 404 Z" fill="#9DAE86"/>
  </g>

  <!-- Lake -->
  <rect x="0" y="398" width="1600" height="162" fill="url(#water)"/>

  <!-- Reflections and ripples -->
  <g stroke="#FFFFFF" stroke-linecap="round" opacity="0.16" filter="url(#wetSoft)">
    <path d="M120 440 H360" stroke-width="3"/>
    <path d="M430 468 H700" stroke-width="4"/>
    <path d="M180 500 H520" stroke-width="3"/>
    <path d="M900 434 H1160" stroke-width="3"/>
    <path d="M1080 486 H1420" stroke-width="4"/>
    <path d="M620 524 H980" stroke-width="3"/>
  </g>
  <g fill="#566B54" opacity="0.18" filter="url(#wetSoft)">
    <rect x="0" y="398" width="1600" height="26"/>
  </g>

  <!-- Gl. Skovridergaard, suggested on the far bank -->
  <g filter="url(#wetSoft)" opacity="0.9">
    <path d="M1206 344 l30-26 30 26 v22 h-60z" fill="#E0D3B9"/>
    <path d="M1200 346 l36-30 36 30z" fill="#BE7460"/>
    <path d="M1272 352 l22-18 22 18 v16 h-44z" fill="#E0D3B9"/>
    <path d="M1268 354 l26-22 26 22z" fill="#BE7460"/>
  </g>

  <!-- Hjejlen: black hull, white deck house, brass funnel, coal smoke -->
  <g transform="translate(560 424)">
    <g filter="url(#wetSoft)" opacity="0.28">
      <ellipse cx="94" cy="66" rx="112" ry="10" fill="#4A5157"/>
    </g>
    <g filter="url(#wetSoft)">
      <!-- smoke -->
      <g fill="#B4B7B2" opacity="0.5">
        <ellipse cx="96" cy="-46" rx="15" ry="11"/>
        <ellipse cx="112" cy="-70" rx="20" ry="14"/>
        <ellipse cx="138" cy="-96" rx="26" ry="17"/>
        <ellipse cx="176" cy="-118" rx="32" ry="20"/>
      </g>
      <!-- hull -->
      <path d="M6 40 C 24 60, 164 60, 184 40 L188 22 H2 Z" fill="#3A4247"/>
      <rect x="2" y="14" width="186" height="10" fill="#BE7460"/>
      <!-- deck house -->
      <rect x="34" y="-16" width="118" height="30" fill="#F3EFE6"/>
      <rect x="34" y="-22" width="118" height="7" fill="#E0D3B9"/>
      <!-- windows -->
      <g fill="#66808A" opacity="0.6">
        <rect x="46" y="-10" width="12" height="12"/>
        <rect x="66" y="-10" width="12" height="12"/>
        <rect x="86" y="-10" width="12" height="12"/>
        <rect x="106" y="-10" width="12" height="12"/>
        <rect x="126" y="-10" width="12" height="12"/>
      </g>
      <!-- funnel -->
      <rect x="86" y="-52" width="17" height="32" fill="#C3A175"/>
      <rect x="86" y="-54" width="17" height="7" fill="#3A4247"/>
      <!-- mast and pennant -->
      <path d="M28 -22 V-58" stroke="#3A4247" stroke-width="2.5"/>
      <path d="M28 -58 l22 7 -22 7z" fill="#BE7460"/>
    </g>
  </g>

  <!-- Paper grain -->
  <rect width="1600" height="560" filter="url(#grain)" opacity="0.1"
        style="mix-blend-mode:multiply"/>
</svg>
