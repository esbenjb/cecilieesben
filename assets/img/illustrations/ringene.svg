<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480"
     role="img" aria-label="Akvarel af de to cirkelformede badebroer ved Almindsø">
  <!--
    Østre Søbad at Almindsø — two interlocking circular timber jetties, seen
    from above. Doubles as the wedding's ring motif. Watercolour house style.
  -->
  <defs>
    <radialGradient id="rg-deep" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#5C7883"/>
      <stop offset="100%" stop-color="#7E9AA1"/>
    </radialGradient>
    <radialGradient id="rg-shallow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#B6C3A4"/>
      <stop offset="100%" stop-color="#9DB4B0"/>
    </radialGradient>

    <filter id="rg-wash" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="8" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <filter id="rg-bleed" x="-16%" y="-16%" width="132%" height="132%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="13" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="rg-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="720" height="480" fill="#8FA9AE"/>

  <!-- Open lake, darker towards the bottom -->
  <g filter="url(#rg-bleed)" opacity="0.55">
    <rect x="0" y="230" width="720" height="250" fill="#5C7883"/>
  </g>

  <!-- Wooded shore along the top -->
  <g filter="url(#rg-bleed)">
    <path d="M0 0 H720 V96 C 600 118, 500 92, 380 106 C 250 120, 140 96, 0 112 Z" fill="#6E8168"/>
    <path d="M0 0 H720 V64 C 590 84, 470 60, 340 74 C 210 88, 110 66, 0 80 Z" fill="#566B54"/>
  </g>
  <!-- Beach -->
  <g filter="url(#rg-bleed)" opacity="0.9">
    <path d="M470 104 C 560 100, 660 116, 720 108 L720 152 C 640 160, 540 144, 466 136 Z"
          fill="#E0D3B9"/>
  </g>

  <!-- Shallow bathing water inside the right ring -->
  <g filter="url(#rg-wash)">
    <circle cx="470" cy="286" r="106" fill="url(#rg-shallow)"/>
    <circle cx="250" cy="266" r="128" fill="url(#rg-deep)"/>
  </g>

  <!-- Sandy bottom showing through the shallow circle -->
  <g filter="url(#rg-bleed)" opacity="0.4">
    <ellipse cx="486" cy="300" rx="72" ry="54" fill="#DCCFB2"/>
  </g>

  <!-- The two timber rings -->
  <g filter="url(#rg-wash)" fill="none" stroke-linecap="round">
    <circle cx="250" cy="266" r="128" stroke="#C9A97C" stroke-width="17"/>
    <circle cx="470" cy="286" r="106" stroke="#C9A97C" stroke-width="15"/>
  </g>
  <!-- Plank shading on the rings -->
  <g filter="url(#rg-wash)" fill="none" stroke="#A98457" stroke-width="2.5" opacity="0.5">
    <circle cx="250" cy="266" r="134"/>
    <circle cx="470" cy="286" r="112"/>
  </g>

  <!-- Walkway from the shore to the rings -->
  <g filter="url(#rg-wash)">
    <path d="M356 150 l30 8 -32 118 -28 -8 Z" fill="#C9A97C"/>
    <path d="M366 262 h44 v18 h-44 z" fill="#C9A97C"/>
  </g>

  <!-- Diving board on the deep ring -->
  <g filter="url(#rg-wash)">
    <path d="M234 138 h34 v16 h-34 z" fill="#C9A97C"/>
  </g>

  <!-- Swimmers and ripple rings — the motif this whole page borrows -->
  <g fill="none" stroke="#F3EFE6" stroke-width="2" opacity="0.55" filter="url(#rg-wash)">
    <circle cx="214" cy="240" r="13"/>
    <circle cx="214" cy="240" r="24"/>
    <circle cx="214" cy="240" r="36"/>
    <circle cx="296" cy="312" r="10"/>
    <circle cx="296" cy="312" r="20"/>
    <circle cx="470" cy="272" r="11"/>
    <circle cx="470" cy="272" r="22"/>
    <circle cx="508" cy="326" r="9"/>
    <circle cx="508" cy="326" r="18"/>
  </g>
  <g fill="#4A5157" opacity="0.5" filter="url(#rg-wash)">
    <ellipse cx="214" cy="240" rx="7" ry="5"/>
    <ellipse cx="296" cy="312" rx="6" ry="4"/>
    <ellipse cx="470" cy="272" rx="6" ry="4"/>
    <ellipse cx="508" cy="326" rx="5" ry="4"/>
  </g>

  <!-- Loose surface ripples across the open water -->
  <g stroke="#F3EFE6" stroke-linecap="round" opacity="0.28" filter="url(#rg-bleed)">
    <path d="M40 400 H210" stroke-width="4"/>
    <path d="M300 424 H520" stroke-width="4"/>
    <path d="M560 386 H700" stroke-width="3"/>
    <path d="M90 452 H340" stroke-width="4"/>
  </g>

  <rect width="720" height="480" filter="url(#rg-grain)" opacity="0.1"
        style="mix-blend-mode:multiply"/>
</svg>
